<svg width="1000" height="620" viewBox="0 0 1000 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1FAE5" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0" y1="0" x2="160" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#047857"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="avatarGrad1" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#047857"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="avatarGrad3" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="avatarGrad4" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="0" y="4" width="1000" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#059669" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1000" height="620" rx="28" fill="url(#bgGrad)"/>

  <!-- Top App Navigation / Page Header -->
  <rect x="24" y="20" width="952" height="76" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="48" y="54" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="20" font-weight="900">Authentication &amp; User Experience 🔐</text>
  <text x="48" y="74" fill="#64748B" font-family="Inter, sans-serif" font-size="12">Seamless Sign-In with Google or Email, personalized Initials Avatars, INR defaults, and smart Greetings</text>

  <rect x="806" y="38" width="154" height="40" rx="14" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="824" y="63" fill="#047857" font-family="Inter, sans-serif" font-size="12" font-weight="800">🔒 Secure INR Vault</text>

  <!-- Left Card: Registration Flow with Details & Initials Avatar -->
  <rect x="24" y="112" width="460" height="488" rx="22" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2" filter="url(#shadow)"/>
  
  <text x="48" y="142" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="16" font-weight="900">Quick Registration</text>
  <text x="48" y="160" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Configures essential Indian financial preferences up-front</text>

  <!-- Live Initials Avatar Showcase Box -->
  <rect x="48" y="174" width="412" height="68" rx="16" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="62" y="184" width="48" height="48" rx="16" fill="url(#avatarGrad1)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="75" y="215" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="900">AS</text>
  <text x="122" y="202" fill="#047857" font-family="Inter, sans-serif" font-size="10" font-weight="800">UNIQUE INITIALS AVATAR</text>
  <text x="122" y="218" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="13" font-weight="800">Arjun Sharma</text>
  <text x="122" y="232" fill="#64748B" font-family="Inter, sans-serif" font-size="10">Generates unique vibrant gradient based on full name character hash</text>

  <!-- Registration Form Fields -->
  <!-- Field 1: Full Name -->
  <text x="48" y="264" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="11" font-weight="700">Full Name</text>
  <rect x="48" y="272" width="198" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="295" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12">Arjun Sharma</text>

  <!-- Field 2: Email -->
  <text x="262" y="264" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="11" font-weight="700">Email Address</text>
  <rect x="262" y="272" width="198" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="274" y="295" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12">arjun@example.com</text>

  <!-- Field 3: Phone Number -->
  <text x="48" y="328" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="11" font-weight="700">Mobile / WhatsApp Number</text>
  <rect x="48" y="336" width="198" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="359" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12">+91 98765 43210</text>

  <!-- Field 4: Preferred Currency -->
  <text x="262" y="328" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="11" font-weight="700">Default Currency</text>
  <rect x="262" y="336" width="198" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="274" y="359" fill="#047857" font-family="Inter, sans-serif" font-size="12" font-weight="800">INR (₹) ▾</text>

  <!-- Field 5: Monthly Budget -->
  <text x="48" y="392" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="11" font-weight="700">Monthly Spending Target (₹)</text>
  <rect x="48" y="400" width="412" height="36" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="423" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12">₹50,000 / month</text>

  <!-- Submit Registration Button -->
  <rect x="48" y="446" width="412" height="38" rx="12" fill="url(#primaryBtn)"/>
  <text x="180" y="470" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="800">Create My Account</text>

  <!-- OR Divider -->
  <line x1="48" y1="500" x2="460" y2="500" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="230" y="490" width="48" height="20" rx="6" fill="#FFFFFF"/>
  <text x="246" y="504" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="800">OR</text>

  <!-- Continue with Google Button (with 4-color Google Logo Icon) -->
  <rect x="48" y="516" width="412" height="38" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <!-- Multi-color Google "G" Icon -->
  <g transform="translate(162, 526) scale(0.75)">
    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
  </g>
  <text x="188" y="540" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12" font-weight="800">Continue with Google</text>

  <text x="144" y="574" fill="#64748B" font-family="Inter, sans-serif" font-size="10">Already registered? <tspan fill="#059669" font-weight="800">Sign In to Vault</tspan></text>


  <!-- Right Column: Avatar Variations & Dynamic Greetings -->
  <rect x="504" y="112" width="472" height="488" rx="22" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2" filter="url(#shadow)"/>

  <text x="528" y="142" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="16" font-weight="900">Personalized User Experience</text>
  <text x="528" y="160" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Visual identity and dynamic context tailored to your daily schedule</text>

  <!-- Time-based Greeting Cards Box -->
  <text x="528" y="196" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12" font-weight="800">TIME-AWARE GREETING SYSTEM</text>

  <!-- Morning Greeting -->
  <rect x="528" y="208" width="424" height="44" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="544" y="235" font-size="16">🌅</text>
  <text x="572" y="235" fill="#92400E" font-family="Inter, sans-serif" font-size="12" font-weight="800">Good morning, Arjun Sharma</text>
  <text x="860" y="235" fill="#B45309" font-family="Inter, sans-serif" font-size="10" font-weight="600">05:00 - 11:59</text>

  <!-- Afternoon Greeting -->
  <rect x="528" y="260" width="424" height="44" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="544" y="287" font-size="16">☀️</text>
  <text x="572" y="287" fill="#065F46" font-family="Inter, sans-serif" font-size="12" font-weight="800">Good afternoon, Arjun Sharma</text>
  <text x="860" y="287" fill="#059669" font-family="Inter, sans-serif" font-size="10" font-weight="600">12:00 - 17:59</text>

  <!-- Evening Greeting -->
  <rect x="528" y="312" width="424" height="44" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="544" y="339" font-size="16">🌙</text>
  <text x="572" y="339" fill="#3730A3" font-family="Inter, sans-serif" font-size="12" font-weight="800">Good evening, Arjun Sharma</text>
  <text x="860" y="339" fill="#4F46E5" font-family="Inter, sans-serif" font-size="10" font-weight="600">18:00 - 04:59</text>

  <!-- Vibrant Initials Avatar Palette Showcase -->
  <text x="528" y="384" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12" font-weight="800">ALGORITHMIC VIBRANT AVATAR PALETTES</text>
  <text x="528" y="400" fill="#64748B" font-family="Inter, sans-serif" font-size="10">No image uploads required — deterministic color harmonies based on character codes</text>

  <g transform="translate(528, 414)">
    <!-- Avatar Sample 1 -->
    <rect x="0" y="0" width="48" height="48" rx="16" fill="url(#avatarGrad1)"/>
    <text x="14" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">AS</text>

    <!-- Avatar Sample 2 -->
    <rect x="64" y="0" width="48" height="48" rx="16" fill="url(#avatarGrad2)"/>
    <text x="76" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">PM</text>

    <!-- Avatar Sample 3 -->
    <rect x="128" y="0" width="48" height="48" rx="16" fill="url(#avatarGrad3)"/>
    <text x="141" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">RK</text>

    <!-- Avatar Sample 4 -->
    <rect x="192" y="0" width="48" height="48" rx="16" fill="url(#avatarGrad4)"/>
    <text x="206" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">AN</text>

    <!-- Avatar Sample 5 -->
    <rect x="256" y="0" width="48" height="48" rx="16" fill="#14B8A6"/>
    <text x="268" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">VK</text>

    <!-- Avatar Sample 6 -->
    <rect x="320" y="0" width="48" height="48" rx="16" fill="#6366F1"/>
    <text x="333" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">TD</text>

    <!-- Avatar Sample 7 -->
    <rect x="376" y="0" width="48" height="48" rx="16" fill="#F43F5E"/>
    <text x="390" y="30" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="900">NP</text>
  </g>

  <!-- Security & Privacy Badge -->
  <rect x="528" y="482" width="424" height="92" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="548" y="506" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="11" font-weight="800">🛡️ PRIVACY &amp; SECURITY BY DESIGN</text>
  <text x="548" y="526" fill="#64748B" font-family="Inter, sans-serif" font-size="10">• Fast 1-click Google Single Sign-On (SSO)</text>
  <text x="548" y="542" fill="#64748B" font-family="Inter, sans-serif" font-size="10">• Strict multi-tenant user data isolation &amp; security rules</text>
  <text x="548" y="558" fill="#64748B" font-family="Inter, sans-serif" font-size="10">• All credentials protected with industry-standard encryption</text>
</svg>
