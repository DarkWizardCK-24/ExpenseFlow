  <text x="676" y="524" fill="#047857" font-family="Inter, sans-serif" font-size="11" font-weight="800">Remaining Budget:</text>
  <text x="886" y="524" fill="#047857" font-family="Inter, sans-serif" font-size="12" font-weight="900">₹21,550</text>

  <rect x="664" y="546" width="292" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="676" y="570" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="600">Daily Safe Spend Limit:</text>
  <text x="898" y="570" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="12" font-weight="900">₹1,026/day</text>
