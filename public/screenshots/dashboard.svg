  <rect x="24" y="96" width="952" height="76" rx="22" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="42" y="110" width="48" height="48" rx="16" fill="url(#primaryCard)"/>
  <text x="54" y="140" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="900">AS</text>
  
  <rect x="102" y="112" width="96" height="18" rx="9" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="112" y="125" fill="#047857" font-family="Inter, sans-serif" font-size="9" font-weight="800" letter-spacing="0.5">₹ LIVE VAULT</text>
