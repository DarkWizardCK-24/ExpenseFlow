  <path d="M698 206V214M698 214L694 210M698 214L702 210" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
  <text x="522" y="248" fill="#DC2626" font-family="Inter, sans-serif" font-size="22" font-weight="900">-₹28,450</text>
  <text x="522" y="272" fill="#64748B" font-family="Inter, sans-serif" font-size="10">57% of ₹50,000 budget</text>

