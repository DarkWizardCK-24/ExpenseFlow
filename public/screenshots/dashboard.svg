    <rect x="135" y="105" width="16" height="55" rx="4" fill="#EF4444"/>
    <text x="123" y="178" fill="#64748B" font-family="Inter" font-size="10" font-weight="600">Jun</text>

    <!-- Jul -->
    <rect x="200" y="28" width="16" height="132" rx="4" fill="#10B981"/>
    <rect x="220" y="95" width="16" height="65" rx="4" fill="#EF4444"/>
    <text x="208" y="178" fill="#64748B" font-family="Inter" font-size="10" font-weight="600">Jul</text>

    <!-- Aug -->
    <rect x="285" y="20" width="16" height="140" rx="4" fill="#10B981"/>
    <rect x="305" y="110" width="16" height="50" rx="4" fill="#EF4444"/>
    <text x="293" y="178" fill="#64748B" font-family="Inter" font-size="10" font-weight="600">Aug</text>

    <!-- Sep -->
    <rect x="370" y="24" width="16" height="136" rx="4" fill="#10B981"/>
    <rect x="390" y="100" width="16" height="60" rx="4" fill="#EF4444"/>
    <text x="378" y="178" fill="#64748B" font-family="Inter" font-size="10" font-weight="600">Sep</text>

    <!-- Oct -->
    <rect x="455" y="15" width="16" height="145" rx="4" fill="#059669"/>
    <rect x="475" y="112" width="16" height="48" rx="4" fill="#EF4444"/>
    <text x="463" y="178" fill="#047857" font-family="Inter" font-size="10" font-weight="900">Oct</text>
