<svg width="1000" height="620" viewBox="0 0 1000 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1FAE5" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="primaryCard" x1="0" y1="0" x2="260" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064E3B"/>
      <stop offset="0.5" stop-color="#059669"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ctaBtn" x1="0" y1="0" x2="150" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#047857"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="0" y="4" width="1000" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#059669" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="1000" height="620" rx="28" fill="url(#bgGrad)"/>

  <!-- Top App Navigation Bar -->
  <rect x="24" y="20" width="952" height="64" rx="20" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="42" y="34" width="36" height="36" rx="12" fill="#059669"/>
  <path d="M52 52V44C52 42.8954 52.8954 42 54 42H66C67.1046 42 68 42.8954 68 44V52C68 53.1046 67.1046 54 66 54H54C52.8954 54 52 53.1046 52 52Z" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="63" cy="48" r="1.5" fill="#FFFFFF"/>
  <text x="88" y="52" fill="#0B3B2E" font-family="Inter, sans-serif" font-size="16" font-weight="900">ExpenseFlow</text>
  <text x="88" y="63" fill="#10B981" font-family="Inter, sans-serif" font-size="9" font-weight="800" letter-spacing="1">SMART INR VAULT</text>

