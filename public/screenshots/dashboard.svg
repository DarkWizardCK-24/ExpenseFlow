  <rect x="872" y="32" width="40" height="40" rx="14" fill="#047857" stroke="#34D399" stroke-width="2"/>
  <text x="883" y="57" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="900">AS</text>

