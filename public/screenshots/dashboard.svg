  <text x="664" y="356" fill="#64748B" font-family="Inter, sans-serif" font-size="10">57% spent of ₹50,000 target</text>

  <!-- Budget Circle Gauge -->
  <g transform="translate(810, 430)">
    <circle cx="0" cy="0" r="48" stroke="#F1F5F9" stroke-width="12" fill="none"/>
    <circle cx="0" cy="0" r="48" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-dasharray="172 301" transform="rotate(-90)" fill="none"/>
    <text x="0" y="-4" text-anchor="middle" fill="#64748B" font-family="Inter" font-size="9" font-weight="700">SPENT</text>
    <text x="0" y="14" text-anchor="middle" fill="#0B3B2E" font-family="Inter" font-size="16" font-weight="900">₹28,450</text>
  </g>

  <!-- Budget Stats Pill -->
